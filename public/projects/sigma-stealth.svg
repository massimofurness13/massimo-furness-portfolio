<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="stealth-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14110d" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <radialGradient id="stealth-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f7e0e4" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#f5f2ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#f5f2ec"/>
  <rect width="800" height="500" fill="url(#stealth-grid)"/>
  <rect width="800" height="500" fill="url(#stealth-glow)"/>

  <text
    x="400"
    y="330"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="400"
    font-size="340"
    fill="#14110d"
    opacity="0.95"
  >Σ</text>

  <g transform="translate(60 445)">
    <text
      font-family="ui-monospace, monospace"
      font-size="11"
      letter-spacing="4"
      fill="#14110d"
      opacity="0.55"
    >SIGMA · AI · EDUCATION</text>
  </g>
</svg>
